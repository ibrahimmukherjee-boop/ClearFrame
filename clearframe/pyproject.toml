[build-system]
requires      = ["hatchling"]
build-backend = "hatchling.build"

[project]
name            = "clearframe"
version         = "0.5.0"
description     = "ClearFrame — open-source AI agent protocol. Private, secure, accessible by default."
readme          = "README.md"
license         = { file = "LICENSE" }
authors         = [{ name = "ClearFrame Contributors" }]
requires-python = ">=3.11"
keywords        = ["ai-agents", "llm", "safety", "auditability", "mcp-alternative", "agentic", "nexus"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "pydantic>=2.6",
    "cryptography>=42.0",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "anyio>=4.3",
    "slowapi>=0.1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
deploy = [
    "gunicorn>=22.0",
]

[project.scripts]
clearframe = "clearframe.cli:app"

[project.urls]
Homepage      = "https://github.com/ibrahimmukherjee-boop/ClearFrame"
Documentation = "https://github.com/ibrahimmukherjee-boop/ClearFrame#readme"
Issues        = "https://github.com/ibrahimmukherjee-boop/ClearFrame/issues"

[tool.hatch.build.targets.wheel]
packages = ["clearframe"]

[tool.hatch.build.targets.wheel.force-include]
"clearframe/web" = "clearframe/web"

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths    = ["tests"]

[tool.mypy]
python_version         = "3.11"
strict                 = true
ignore_missing_imports = true

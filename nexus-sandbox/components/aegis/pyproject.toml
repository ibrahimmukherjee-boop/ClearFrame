[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-aegis"
version = "0.1.0"
description = "Nexus Protocol Aegis — Human-in-the-Loop agent control"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
]

[project.scripts]
aegis = "aegis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["aegis"]

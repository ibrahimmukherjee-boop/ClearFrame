[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-sonar"
version = "0.1.0"
description = "Nexus Protocol Sonar — AI agent SOC threat detection"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
sonar = "sonar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["sonar"]

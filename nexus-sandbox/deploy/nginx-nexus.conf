# Nexus Protocol — EC2 nginx reverse proxy (optional)
# Use when you want port 80 → 8080 without running Python as root.
#
# Install:  sudo apt install nginx
# Deploy:   sudo cp deploy/nginx-nexus.conf /etc/nginx/sites-available/nexus
#           sudo ln -sf /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/
#           sudo rm -f /etc/nginx/sites-enabled/default
#           sudo nginx -t && sudo systemctl reload nginx
#
# Security group: open TCP 80 from your IP (or 0.0.0.0/0 for public demo)

upstream nexus_gateway {
    server 127.0.0.1:8080;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # No authentication — sandbox demo only
    location / {
        proxy_pass http://nexus_gateway;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

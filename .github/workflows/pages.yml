name: Deploy frontend to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "platform/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install
        working-directory: platform
        run: npm ci
      - name: Build
        working-directory: platform
        # Optionally hardwire a backend by setting the repo variable VITE_API_URL
        # (e.g. https://your-backend.onrender.com/api). If unset, the app uses
        # same-origin '/api' and shows a "Connect a backend" field on the login.
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

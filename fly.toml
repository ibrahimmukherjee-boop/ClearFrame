# NexusProtocol — Fly.io (no AWS, global edge)
# Deploy:
#   fly launch --no-deploy --copy-config --name nexusprotocol
#   fly volumes create nexus_data --size 1
#   fly deploy
app = "nexusprotocol"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CLEARFRAME_DEMO = "1"
  NEXUS_HOME = "/data/nexus"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.checks]
    [http_service.checks.health]
      method = "GET"
      path = "/health"
      interval = "15s"
      timeout = "5s"
      grace_period = "10s"

[[mounts]]
  source = "nexus_data"
  destination = "/data/nexus"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

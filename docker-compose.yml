services:
  clearframe:
    build:
      context: .
      dockerfile: Dockerfile
    image: clearframe:0.3.0
    ports:
      - "8080:8080"
    environment:
      CLEARFRAME_DEMO: "1"
      CLEARFRAME_HOST: "0.0.0.0"
      CLEARFRAME_PORT: "8080"
      NEXUS_HOME: "/data/nexus"
    volumes:
      - nexus-data:/data/nexus
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  nexus-data:

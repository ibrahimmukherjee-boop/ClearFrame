<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ClearFrame — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
:root {
  --bg: #0c0e0a;
  --text: #f2f1ea;
  --muted: #8a8a7a;
  --lime: #d9e69d;
  --lime-dim: rgba(217,230,157,.14);
  --red: #c93a3a;
  --glass: rgba(255,255,255,.05);
  --border: rgba(255,255,255,.12);
  --font: "Space Grotesk", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}
.atmosphere {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background:
    radial-gradient(ellipse 70% 50% at 50% 20%, rgba(217,230,157,.2), transparent 55%),
    linear-gradient(180deg, #0c0e0a, #10130c 50%, #0a0b08);
}
.grain {
  position: fixed; inset: 0; z-index: 1; pointer-events: none; opacity: .35;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.55'/%3E%3C/svg%3E");
  mix-blend-mode: overlay;
}
.grid {
  position: fixed; inset: 0; z-index: 1; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 48px 48px;
  mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, black, transparent);
}
.shell {
  position: relative; z-index: 2; min-height: 100vh;
  display: grid; place-items: center; padding: 1.5rem;
}
.card {
  width: min(420px, 100%);
  background: var(--glass);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 2rem 1.75rem 1.5rem;
  backdrop-filter: blur(18px);
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.brand {
  display: flex; align-items: center; gap: .85rem; margin-bottom: 1.25rem;
}
.mark {
  width: 42px; height: 42px; border: 1.5px solid rgba(255,255,255,.85);
  border-radius: 10px; display: grid; place-items: center;
  box-shadow: 0 0 30px rgba(217,230,157,.18);
}
.mark svg { width: 22px; height: 22px; }
.brand h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -.02em; }
.brand p { font-size: .72rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-top: .15rem; }
.mission {
  font-size: .92rem; line-height: 1.45; color: var(--muted); margin-bottom: 1.5rem;
}
.mission em { font-style: normal; color: var(--lime); }
label {
  display: block; font-family: var(--mono); font-size: .68rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
  margin-bottom: .4rem;
}
input {
  width: 100%; padding: .85rem 1rem; margin-bottom: 1rem;
  border-radius: 10px; border: 1px solid var(--border);
  background: rgba(0,0,0,.35); color: var(--text);
  font-family: var(--font); font-size: .95rem; outline: none;
}
input:focus { border-color: rgba(217,230,157,.55); box-shadow: 0 0 0 3px rgba(217,230,157,.12); }
.btn {
  width: 100%; border: none; border-radius: 10px; padding: .9rem 1rem;
  font-family: var(--font); font-weight: 600; font-size: .95rem;
  background: var(--lime); color: #12140f; cursor: pointer;
  box-shadow: 0 0 28px rgba(217,230,157,.28);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover { box-shadow: 0 0 40px rgba(217,230,157,.4); }
.btn:active { transform: scale(.98); }
.error {
  display: none; margin-bottom: 1rem; padding: .7rem .85rem;
  border-radius: 8px; background: rgba(201,58,58,.15);
  border: 1px solid rgba(201,58,58,.35); color: #ffb4b4;
  font-size: .85rem;
}
.error.show { display: block; }
.hint {
  margin-top: 1rem; font-family: var(--mono); font-size: .68rem;
  color: var(--muted); letter-spacing: .04em; text-align: center; line-height: 1.5;
}
.footer {
  margin-top: 1.25rem; text-align: center;
  font-family: var(--mono); font-size: .62rem; letter-spacing: .1em;
  text-transform: uppercase; color: var(--muted);
}
</style>
</head>
<body>
<div class="atmosphere"></div>
<div class="grain"></div>
<div class="grid"></div>
<main class="shell">
  <form class="card" id="login-form" autocomplete="on">
    <div class="brand">
      <div class="mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.6">
          <path d="M8 8c-2.2 2.2-2.2 5.8 0 8M16 8c2.2 2.2 2.2 5.8 0 8M10 12h4"/>
          <circle cx="8" cy="12" r="2.2"/><circle cx="16" cy="12" r="2.2"/>
        </svg>
      </div>
      <div>
        <h1>ClearFrame</h1>
        <p>Nexus Protocol</p>
      </div>
    </div>
    <p class="mission">Private, <em>secure</em>, and accessible by default. Sign in to open the control plane.</p>
    <div class="error" id="error">Invalid username or password.</div>
    <label for="username">Username</label>
    <input id="username" name="username" type="text" required autofocus placeholder="Username" />
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required placeholder="Password" />
    <button class="btn" type="submit">Sign in</button>
    <p class="hint">Demo credentials are in your deployment message.</p>
    <div class="footer">Multi-model routing / Agents / Deployed</div>
  </form>
</main>
<script>
(function () {
  const KEY = "clearframe_session_v1";
  // Demo auth for GitHub Pages (static). Change before production.
  const USERS = {
    admin: "NexusProtocol2026!",
    clearframe: "ClearFrame!Edge",
  };

  if (sessionStorage.getItem(KEY) === "ok") {
    location.replace("./app.html");
    return;
  }

  document.getElementById("login-form").addEventListener("submit", function (e) {
    e.preventDefault();
    const u = document.getElementById("username").value.trim();
    const p = document.getElementById("password").value;
    if (USERS[u] && USERS[u] === p) {
      sessionStorage.setItem(KEY, "ok");
      sessionStorage.setItem("clearframe_user", u);
      location.href = "./app.html";
    } else {
      document.getElementById("error").classList.add("show");
    }
  });
})();
</script>
</body>
</html>

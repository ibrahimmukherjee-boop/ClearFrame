services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: clearframe
      POSTGRES_USER: clearframe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clearframe-dev}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clearframe"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  clearframe-stack:
    build: .
    ports:
      - "8080:8080"
      - "7477:7477"
    environment:
      CLEARFRAME_API_HOST: 0.0.0.0
      CLEARFRAME_API_PORT: 8080
      CLEARFRAME_DATA_DIR: /data
      CLEARFRAME_AUTH: "true"
      CLEARFRAME_ENV: ${CLEARFRAME_ENV:-development}
      CLEARFRAME_JWT_SECRET: ${CLEARFRAME_JWT_SECRET:-}
      USE_CLEARFRAME_RUNTIME: "true"
      USE_CLEARFRAME_OPS: "true"
      USE_OLLAMA: "true"
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql://clearframe:${POSTGRES_PASSWORD:-clearframe-dev}@postgres:5432/clearframe
      REDIS_URL: redis://redis:6379/0
      CLEARFRAME_VAULT_PASSPHRASE: ${CLEARFRAME_VAULT_PASSPHRASE:-erasys-local-dev}
      CLEARFRAME_AUDIT_SECRET: ${CLEARFRAME_AUDIT_SECRET:-erasys-local-audit-secret}
    volumes:
      - clearframe-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  clearframe-data:
  pg-data:
  redis-data:
  ollama-data:
